<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Over</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, rgba(0,15,25,0.85) 0%, rgba(0,5,15,0.95) 100%);
    }

    .overlay.show {
      display: flex;
      animation: overlayIn 0.4s ease-out;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Grid pattern overlay */
    .overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(rgba(0,212,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 1;
    }

    /* Animated horizontal scan */
    .overlay::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg,
        transparent 0%,
        transparent 48%,
        rgba(0,212,255,0.1) 49%,
        rgba(0,212,255,0.2) 50%,
        rgba(0,212,255,0.1) 51%,
        transparent 52%,
        transparent 100%
      );
      animation: scanDown 6s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    @keyframes scanDown {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(100%); }
    }

    .game-over-box {
      position: relative;
      background: linear-gradient(180deg, rgba(0,20,35,0.95) 0%, rgba(0,10,25,0.98) 100%);
      padding: 60px 120px;
      text-align: center;
      z-index: 10;
      clip-path: polygon(
        40px 0, calc(100% - 40px) 0,
        100% 40px, 100% calc(100% - 20px),
        calc(100% - 20px) 100%, 20px 100%,
        0 calc(100% - 20px), 0 40px
      );
    }

    /* Outer glow frame */
    .game-over-box::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg,
        var(--team-glow) 0%,
        rgba(0,212,255,0.15) 25%,
        rgba(0,212,255,0.15) 75%,
        var(--team-glow) 100%
      );
      clip-path: polygon(
        40px 0, calc(100% - 40px) 0,
        100% 40px, 100% calc(100% - 20px),
        calc(100% - 20px) 100%, 20px 100%,
        0 calc(100% - 20px), 0 40px
      );
      z-index: -1;
      animation: victoryPulse 2s ease-in-out infinite;
    }

    @keyframes victoryPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Corner brackets */
    .corner-bracket {
      position: absolute;
      width: 25px;
      height: 25px;
      border-color: var(--team-color);
      border-style: solid;
      pointer-events: none;
      opacity: 0.7;
    }

    .corner-bracket.tl { top: 15px; left: 15px; border-width: 3px 0 0 3px; }
    .corner-bracket.tr { top: 15px; right: 15px; border-width: 3px 3px 0 0; }
    .corner-bracket.bl { bottom: 15px; left: 15px; border-width: 0 0 3px 3px; }
    .corner-bracket.br { bottom: 15px; right: 15px; border-width: 0 3px 3px 0; }

    /* Team color variables */
    .game-over-box.red {
      --team-color: #ff4444;
      --team-glow: rgba(255,68,68,0.6);
      --team-secondary: #ff6b6b;
    }
    .game-over-box.blue {
      --team-color: #4488ff;
      --team-glow: rgba(68,136,255,0.6);
      --team-secondary: #6bb3ff;
    }
    .game-over-box.tie {
      --team-color: #00d4ff;
      --team-glow: rgba(0,212,255,0.6);
      --team-secondary: #66e0ff;
    }

    /* Victory label */
    .victory-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 12px;
      color: rgba(0,212,255,0.6);
      text-transform: uppercase;
      margin-bottom: 15px;
      animation: labelIn 0.5s ease-out 0.2s both;
    }

    @keyframes labelIn {
      from { opacity: 0; transform: translateY(-15px); letter-spacing: 20px; }
      to { opacity: 1; transform: translateY(0); letter-spacing: 12px; }
    }

    .winner-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 72px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 10px;
      margin-bottom: 35px;
      color: var(--team-color);
      text-shadow:
        0 0 30px var(--team-glow),
        0 0 60px var(--team-glow),
        0 0 100px var(--team-glow);
      animation: titleIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes titleIn {
      0% {
        opacity: 0;
        transform: scale(1.8) translateY(-30px);
        filter: blur(15px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    /* Score display */
    .score-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      margin-bottom: 40px;
      animation: scoreIn 0.5s ease-out 0.3s both;
    }

    @keyframes scoreIn {
      from { opacity: 0; transform: translateY(25px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .team-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 140px;
      padding: 20px 30px;
      background: rgba(0,0,0,0.3);
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .team-score.red {
      border-left: 2px solid rgba(255,68,68,0.4);
    }

    .team-score.blue {
      border-right: 2px solid rgba(68,136,255,0.4);
    }

    .team-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .team-label.red {
      color: rgba(255,68,68,0.8);
      text-shadow: 0 0 10px rgba(255,68,68,0.4);
    }
    .team-label.blue {
      color: rgba(68,136,255,0.8);
      text-shadow: 0 0 10px rgba(68,136,255,0.4);
    }

    .score-value {
      font-family: 'Share Tech Mono', monospace;
      font-size: 56px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: 3px;
    }

    .score-value.red {
      color: #ff4444;
      text-shadow: 0 0 25px rgba(255,68,68,0.6);
    }

    .score-value.blue {
      color: #4488ff;
      text-shadow: 0 0 25px rgba(68,136,255,0.6);
    }

    .score-divider {
      font-family: 'Orbitron', sans-serif;
      font-size: 48px;
      font-weight: 400;
      color: rgba(0,212,255,0.4);
    }

    /* Horizontal line accent */
    .divider-line {
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,212,255,0.2) 20%,
        var(--team-color) 50%,
        rgba(0,212,255,0.2) 80%,
        transparent 100%
      );
      margin-bottom: 25px;
      animation: lineIn 0.8s ease-out 0.4s both;
    }

    @keyframes lineIn {
      from { transform: scaleX(0); opacity: 0; }
      to { transform: scaleX(1); opacity: 1; }
    }

    /* Loading state */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 25px;
    }

    .loaded {
      display: none;
    }

    .game-over-box.ready .loading {
      display: none;
    }

    .game-over-box.ready .loaded {
      display: block;
    }

    .loading-spinner {
      width: 60px;
      height: 60px;
      border: 3px solid rgba(0,212,255,0.15);
      border-top-color: rgba(0,212,255,0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: rgba(0,212,255,0.6);
      letter-spacing: 6px;
      text-transform: uppercase;
    }

    /* Victory emblem - decorative hexagon */
    .victory-emblem {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 60px;
      background: linear-gradient(180deg, var(--team-color) 0%, var(--team-glow) 100%);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
      opacity: 0;
      animation: emblemIn 0.6s ease-out 0.5s forwards;
    }

    .victory-emblem::before {
      content: '';
      position: absolute;
      top: 4px;
      left: 4px;
      right: 4px;
      bottom: 4px;
      background: rgba(0,20,35,0.9);
      clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    }

    @keyframes emblemIn {
      from {
        opacity: 0;
        transform: translateX(-50%) scale(0.5) rotate(-180deg);
      }
      to {
        opacity: 1;
        transform: translateX(-50%) scale(1) rotate(0deg);
      }
    }

    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,20,30,0.9);
      color: #00d4ff;
      padding: 6px 12px;
      font-size: 11px;
      font-family: 'Share Tech Mono', monospace;
      z-index: 999;
      border: 1px solid rgba(0,212,255,0.3);
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="game-over-box" id="gameOverBox">
      <div class="corner-bracket tl"></div>
      <div class="corner-bracket tr"></div>
      <div class="corner-bracket bl"></div>
      <div class="corner-bracket br"></div>
      <div class="victory-emblem"></div>

      <!-- Loading state -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <span class="loading-text">// Calculating Results</span>
      </div>

      <!-- Loaded state -->
      <div class="loaded">
        <div class="victory-label">// Match Complete</div>
        <div class="winner-text" id="winnerText">VICTORY</div>

        <div class="score-container">
          <div class="team-score red">
            <span class="team-label red">Red</span>
            <span class="score-value red" id="redScore">0</span>
          </div>
          <span class="score-divider">:</span>
          <div class="team-score blue">
            <span class="team-label blue">Blue</span>
            <span class="score-value blue" id="blueScore">0</span>
          </div>
        </div>

        <div class="divider-line"></div>
      </div>
    </div>
  </div>

  <div id="debug">SPARTAN DEBRIEF v2.0</div>

  <script>
    // ===========================================
    // Game Over Screen for Portals TDM - HALO
    // ===========================================

    const gameOverBox = document.getElementById('gameOverBox');
    const winnerTextEl = document.getElementById('winnerText');
    const redScoreEl = document.getElementById('redScore');
    const blueScoreEl = document.getElementById('blueScore');
    const debugEl = document.getElementById('debug');

    function debug(msg) {
      console.log('[GameOver]', msg);
      debugEl.textContent = msg;
    }

    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        winner: params.get('winner'),
        red: params.get('red'),
        blue: params.get('blue')
      };
    }

    function displayGameOver(winner, redScore, blueScore) {
      gameOverBox.classList.remove('red', 'blue', 'tie');
      gameOverBox.classList.add(winner);

      if (winner === 'red') {
        winnerTextEl.textContent = 'RED WINS';
      } else if (winner === 'blue') {
        winnerTextEl.textContent = 'BLUE WINS';
      } else {
        winnerTextEl.textContent = 'DRAW';
      }

      redScoreEl.textContent = redScore;
      blueScoreEl.textContent = blueScore;

      document.querySelector('.overlay').classList.add('show');
      gameOverBox.classList.add('ready');

      debug('Result: ' + winner.toUpperCase() + ' | ' + redScore + '-' + blueScore);
    }

    function handleMessage(message) {
      console.log('[GameOver] Received:', message);

      let msg = message;

      if (typeof message === 'string') {
        try {
          msg = JSON.parse(message);
        } catch (e) {
          msg = message;
        }
      }

      const msgStr = typeof msg === 'string' ? msg : JSON.stringify(msg);

      if (msgStr.startsWith('gameover_')) {
        const parts = msgStr.split('_');
        if (parts.length >= 4) {
          const winner = parts[1];
          const redScore = parts[2];
          const blueScore = parts[3];
          displayGameOver(winner, redScore, blueScore);
        }
      }
    }

    const urlParams = getUrlParams();
    const winner = urlParams.winner;

    function sendGameoverReady() {
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.sendMessageToUnity) {
        PortalsSdk.sendMessageToUnity(JSON.stringify({
          TaskName: 'gameover_ready',
          TaskTargetState: 'SetNotActiveToCompleted'
        }));
        debug('Sent gameover_ready');
      }
    }

    if (winner) {
      debug('Winner from URL: ' + winner);

      function handleScoresMessage(message) {
        console.log('[GameOver] Received:', message);

        let msg = typeof message === 'string' ? message : JSON.stringify(message);

        if (msg.startsWith('scores_')) {
          const parts = msg.split('_');
          if (parts.length >= 3) {
            const redScore = Math.min(50, parseInt(parts[1]) || 0);
            const blueScore = Math.min(50, parseInt(parts[2]) || 0);
            displayGameOver(winner, redScore, blueScore);
          }
        }

        if (msg === 'show_gameover') {
          debug('Re-activation trigger');
          sendGameoverReady();
        }
      }

      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
        PortalsSdk.setMessageListener(handleScoresMessage);
        debug('SDK listener ready');
      } else {
        window.addEventListener('message', (e) => handleScoresMessage(e.data));
        debug('Fallback listener');
      }
    } else {
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
        PortalsSdk.setMessageListener(handleMessage);
        debug('SDK listener registered');
      } else {
        window.addEventListener('message', (e) => handleMessage(e.data));
        debug('Using fallback listener');
      }
      debug('No URL params - waiting');
    }

    setTimeout(() => {
      sendGameoverReady();
    }, 500);

    debug('Initialized');
  </script>
</body>
</html>
