<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Over</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: none;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0.9) 100%);
    }

    .overlay.show {
      display: flex;
      animation: overlayIn 0.3s ease-out;
    }

    @keyframes overlayIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    /* Scanline effect */
    .overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0.1) 0px,
        rgba(0,0,0,0.1) 1px,
        transparent 1px,
        transparent 3px
      );
      pointer-events: none;
      z-index: 10;
    }

    .game-over-box {
      position: relative;
      background: transparent;
      padding: 80px 180px;
      text-align: center;
      border: none;
    }


    /* Team color variables */
    .game-over-box.red { --team-color: #ef4444; --team-glow: rgba(239,68,68,0.6); }
    .game-over-box.blue { --team-color: #3b82f6; --team-glow: rgba(59,130,246,0.6); }
    .game-over-box.tie { --team-color: #a855f7; --team-glow: rgba(168,85,247,0.6); }

    /* Victory label */
    .victory-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 10px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      margin-bottom: 12px;
      animation: labelIn 0.5s ease-out 0.2s both;
    }

    @keyframes labelIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .winner-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 96px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 8px;
      margin-bottom: 40px;
      color: var(--team-color);
      text-shadow:
        0 0 30px var(--team-glow),
        0 0 60px var(--team-glow),
        0 0 90px var(--team-glow);
      animation: titleIn 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes titleIn {
      0% {
        opacity: 0;
        transform: scale(1.5) translateY(-20px);
        filter: blur(10px);
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
        filter: blur(0);
      }
    }

    /* Score display */
    .score-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 50px;
      margin-bottom: 45px;
      animation: scoreIn 0.5s ease-out 0.3s both;
    }

    @keyframes scoreIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .team-score {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 120px;
    }

    .team-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .team-label.red { color: rgba(239,68,68,0.8); }
    .team-label.blue { color: rgba(59,130,246,0.8); }

    .score-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 72px;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .score-value.red {
      color: #fca5a5;
      text-shadow: 0 0 20px rgba(239,68,68,0.5);
    }

    .score-value.blue {
      color: #93c5fd;
      text-shadow: 0 0 20px rgba(59,130,246,0.5);
    }

    .score-divider {
      font-family: 'Orbitron', sans-serif;
      font-size: 56px;
      font-weight: 400;
      color: rgba(255,255,255,0.3);
    }

    /* Horizontal line accent */
    .divider-line {
      width: 100%;
      height: 1px;
      background: linear-gradient(90deg, transparent 0%, var(--team-color) 50%, transparent 100%);
      margin-bottom: 25px;
      opacity: 0.5;
      animation: lineIn 0.8s ease-out 0.4s both;
    }

    @keyframes lineIn {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    .refresh-prompt {
      font-family: 'Rajdhani', sans-serif;
      font-size: 22px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 8px;
      animation: promptPulse 2.5s ease-in-out infinite;
    }

    @keyframes promptPulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 0.9; }
    }

    /* Loading state */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .loaded {
      display: none;
    }

    .game-over-box.ready .loading {
      display: none;
    }

    .game-over-box.ready .loaded {
      display: block;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      letter-spacing: 4px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="game-over-box" id="gameOverBox">
      <!-- Loading state -->
      <div class="loading">
        <div class="loading-spinner"></div>
        <span class="loading-text">Calculating...</span>
      </div>

      <!-- Loaded state -->
      <div class="loaded">
        <div class="victory-label">Match Complete</div>
        <div class="winner-text" id="winnerText">RED WINS</div>

        <div class="score-container">
          <div class="team-score">
            <span class="team-label red">Red</span>
            <span class="score-value red" id="redScore">0</span>
          </div>
          <span class="score-divider">:</span>
          <div class="team-score">
            <span class="team-label blue">Blue</span>
            <span class="score-value blue" id="blueScore">0</span>
          </div>
        </div>

        <div class="divider-line"></div>
        <div class="refresh-prompt">Refresh to play again</div>
      </div>
    </div>
  </div>

  <script>
    // ===========================================
    // Game Over Screen for Portals TDM
    // Reads winner/scores from URL parameters on load
    // URL format: ?winner=red&red=50&blue=32
    // ===========================================

    const gameOverBox = document.getElementById('gameOverBox');
    const winnerTextEl = document.getElementById('winnerText');
    const redScoreEl = document.getElementById('redScore');
    const blueScoreEl = document.getElementById('blueScore');

    // Parse URL parameters
    function getUrlParams() {
      const params = new URLSearchParams(window.location.search);
      return {
        winner: params.get('winner'),
        red: params.get('red'),
        blue: params.get('blue')
      };
    }

    function displayGameOver(winner, redScore, blueScore) {
      // Set team color class on box for CSS variables
      gameOverBox.classList.remove('red', 'blue', 'tie');
      gameOverBox.classList.add(winner);

      // Set winner text
      if (winner === 'red') {
        winnerTextEl.textContent = 'RED WINS';
      } else if (winner === 'blue') {
        winnerTextEl.textContent = 'BLUE WINS';
      } else {
        winnerTextEl.textContent = 'DRAW';
      }

      // Set scores
      redScoreEl.textContent = redScore;
      blueScoreEl.textContent = blueScore;

      // Show the overlay and loaded state
      document.querySelector('.overlay').classList.add('show');
      gameOverBox.classList.add('ready');

      console.log('[GameOver] Displayed:', winner, redScore, '-', blueScore);
    }

    function handleMessage(message) {
      console.log('[GameOver] Received:', message);

      let msg = message;

      // Parse if string
      if (typeof message === 'string') {
        try {
          msg = JSON.parse(message);
        } catch (e) {
          // Keep as string
          msg = message;
        }
      }

      // Convert to string for parsing
      const msgStr = typeof msg === 'string' ? msg : JSON.stringify(msg);

      // Parse gameover message: gameover_winner_red_blue
      if (msgStr.startsWith('gameover_')) {
        const parts = msgStr.split('_');
        if (parts.length >= 4) {
          const winner = parts[1];      // 'red', 'blue', or 'tie'
          const redScore = parts[2];    // red team score
          const blueScore = parts[3];   // blue team score
          displayGameOver(winner, redScore, blueScore);
        }
      }
    }

    // Get winner from URL (hardcoded in iframe URL)
    const urlParams = getUrlParams();
    const winner = urlParams.winner;

    if (winner) {
      console.log('[GameOver] Winner from URL:', winner);

      // Set up listener for scores message
      function handleScoresMessage(message) {
        console.log('[GameOver] Received:', message);

        let msg = typeof message === 'string' ? message : JSON.stringify(message);

        // Parse scores message: scores_50_32
        if (msg.startsWith('scores_')) {
          const parts = msg.split('_');
          if (parts.length >= 3) {
            const redScore = Math.min(50, parseInt(parts[1]) || 0);
            const blueScore = Math.min(50, parseInt(parts[2]) || 0);
            displayGameOver(winner, redScore, blueScore);
          }
        }
      }

      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
        PortalsSdk.setMessageListener(handleScoresMessage);
        console.log('[GameOver] SDK listener registered - waiting for scores');
      } else {
        window.addEventListener('message', (e) => handleScoresMessage(e.data));
        console.log('[GameOver] Fallback listener - waiting for scores');
      }
    } else {
      // No winner in URL - use legacy message handling
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
        PortalsSdk.setMessageListener(handleMessage);
        console.log('[GameOver] SDK listener registered');
      } else {
        window.addEventListener('message', (e) => handleMessage(e.data));
        console.log('[GameOver] Using fallback listener');
      }
      console.log('[GameOver] No URL params - waiting for gameover message');
    }

    // Notify Portals that game over screen is ready
    // Use delay to ensure SDK connection is established
    setTimeout(() => {
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.sendMessageToUnity) {
        PortalsSdk.sendMessageToUnity(JSON.stringify({
          TaskName: 'gameover_ready',
          TaskTargetState: 'SetNotActiveToCompleted'
        }));
        console.log('[GameOver] Sent gameover_ready to Portals');
      } else {
        console.log('[GameOver] SDK not available - cannot send gameover_ready');
      }
    }, 500);

    console.log('[GameOver] Initialized');
  </script>
</body>
</html>
