<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDM Leaderboard</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005462"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .hud-container {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      padding-top: 10px;
    }

    /* Main HUD Panel - Angular Halo Style */
    .hud-panel {
      position: relative;
      display: flex;
      align-items: stretch;
      background: linear-gradient(180deg, rgba(0,20,30,0.95) 0%, rgba(0,10,20,0.98) 100%);
      clip-path: polygon(
        20px 0, calc(100% - 20px) 0,
        100% 20px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%,
        0 calc(100% - 8px), 0 20px
      );
      border: none;
    }

    /* Outer glow frame */
    .hud-panel::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg, rgba(0,212,255,0.6) 0%, rgba(0,212,255,0.1) 50%, rgba(0,212,255,0.6) 100%);
      clip-path: polygon(
        20px 0, calc(100% - 20px) 0,
        100% 20px, 100% calc(100% - 8px),
        calc(100% - 8px) 100%, 8px 100%,
        0 calc(100% - 8px), 0 20px
      );
      z-index: -1;
      animation: borderPulse 3s ease-in-out infinite;
    }

    @keyframes borderPulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* Animated scan line */
    .hud-panel::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,212,255,0.1) 45%,
        rgba(0,212,255,0.3) 50%,
        rgba(0,212,255,0.1) 55%,
        transparent 100%
      );
      animation: scanLine 4s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes scanLine {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* Team score sections */
    .team-section {
      display: flex;
      align-items: center;
      padding: 12px 28px;
      min-width: 180px;
      position: relative;
    }

    .team-section.red {
      background: linear-gradient(135deg, rgba(255,50,50,0.25) 0%, rgba(180,30,30,0.15) 100%);
      border-right: 2px solid rgba(255,100,100,0.3);
    }

    .team-section.blue {
      background: linear-gradient(135deg, rgba(30,100,255,0.15) 0%, rgba(50,130,255,0.25) 100%);
      border-left: 2px solid rgba(100,150,255,0.3);
      flex-direction: row-reverse;
    }

    .team-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      opacity: 0.9;
    }

    .team-section.red .team-label {
      color: #ff6b6b;
      text-shadow: 0 0 10px rgba(255,100,100,0.8);
      margin-right: 15px;
    }

    .team-section.blue .team-label {
      color: #6bb3ff;
      text-shadow: 0 0 10px rgba(100,150,255,0.8);
      margin-left: 15px;
    }

    .score {
      font-family: 'Share Tech Mono', monospace;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 2px;
    }

    .team-section.red .score {
      color: #ff4444;
      text-shadow: 0 0 20px rgba(255,68,68,0.8), 0 0 40px rgba(255,68,68,0.4);
    }

    .team-section.blue .score {
      color: #4488ff;
      text-shadow: 0 0 20px rgba(68,136,255,0.8), 0 0 40px rgba(68,136,255,0.4);
    }

    /* Center timer section */
    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 8px 25px;
      min-width: 120px;
      background: rgba(0,212,255,0.05);
      border-left: 1px solid rgba(0,212,255,0.2);
      border-right: 1px solid rgba(0,212,255,0.2);
      position: relative;
    }

    /* Corner brackets */
    .timer-section::before,
    .timer-section::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: rgba(0,212,255,0.6);
      border-style: solid;
    }

    .timer-section::before {
      top: 6px;
      left: 6px;
      border-width: 2px 0 0 2px;
    }

    .timer-section::after {
      bottom: 6px;
      right: 6px;
      border-width: 0 2px 2px 0;
    }

    .timer-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 9px;
      color: rgba(0,212,255,0.7);
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-bottom: 2px;
    }

    .timer {
      font-family: 'Share Tech Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      color: #00d4ff;
      text-shadow: 0 0 15px rgba(0,212,255,0.8);
      letter-spacing: 3px;
    }

    .timer.warning {
      color: #ffaa00;
      text-shadow: 0 0 15px rgba(255,170,0,0.8);
      animation: timerPulse 1s ease-in-out infinite;
    }

    .timer.critical {
      color: #ff4444;
      text-shadow: 0 0 20px rgba(255,68,68,1);
      animation: timerPulse 0.5s ease-in-out infinite;
    }

    @keyframes timerPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }

    /* Score change animation */
    .score.changed {
      animation: scoreFlash 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes scoreFlash {
      0% {
        transform: scale(1.4);
        filter: brightness(2);
      }
      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }

    /* Kill indicator (shows briefly on score) */
    .kill-indicator {
      position: absolute;
      top: -20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
    }

    .team-section.red .kill-indicator {
      color: #ff4444;
      right: 20px;
    }

    .team-section.blue .kill-indicator {
      color: #4488ff;
      left: 20px;
    }

    .kill-indicator.show {
      animation: killPop 1s ease-out forwards;
    }

    @keyframes killPop {
      0% {
        opacity: 1;
        transform: translateY(0) scale(1.2);
      }
      100% {
        opacity: 0;
        transform: translateY(-20px) scale(0.8);
      }
    }

    /* Debug */
    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,20,30,0.9);
      color: #00d4ff;
      padding: 5px 10px;
      font-size: 11px;
      font-family: 'Share Tech Mono', monospace;
      border: 1px solid rgba(0,212,255,0.3);
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    }
  </style>
</head>
<body>
  <div class="hud-container">
    <div class="hud-panel">
      <div class="team-section red">
        <span class="kill-indicator" id="redKill">+1</span>
        <span class="team-label">Red</span>
        <span class="score" id="redScore">0</span>
      </div>

      <div class="timer-section">
        <span class="timer-label">Time</span>
        <span class="timer" id="timer">10:00</span>
      </div>

      <div class="team-section blue">
        <span class="kill-indicator" id="blueKill">+1</span>
        <span class="score" id="blueScore">0</span>
        <span class="team-label">Blue</span>
      </div>
    </div>
  </div>

  <div id="debug">LOCAL TIMER v3.0</div>

  <script>
    // ===========================================
    // TDM Leaderboard - LOCAL TIMER VERSION
    // ===========================================
    // Timer runs locally in the iframe after receiving game_start
    // No longer relies on Portals server-side timer (Elapsed_Seconds)
    // ===========================================

    const GAME_DURATION = 600; // 10 minutes in seconds
    const WIN_SCORE = 50;

    let redScore = 0;
    let blueScore = 0;
    let timeRemaining = GAME_DURATION;
    let timerInterval = null;
    let gameActive = false;
    let gameStartedClean = false;

    const redScoreEl = document.getElementById('redScore');
    const blueScoreEl = document.getElementById('blueScore');
    const timerEl = document.getElementById('timer');
    const redKillEl = document.getElementById('redKill');
    const blueKillEl = document.getElementById('blueKill');
    const debugEl = document.getElementById('debug');

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
      timerEl.textContent = formatTime(timeRemaining);
      timerEl.classList.remove('warning', 'critical');
      if (timeRemaining <= 60) {
        timerEl.classList.add('critical');
      } else if (timeRemaining <= 120) {
        timerEl.classList.add('warning');
      }
    }

    // Start the local game timer
    function startLocalTimer() {
      // Clear any existing timer
      if (timerInterval) {
        clearInterval(timerInterval);
      }

      // Reset game state
      gameActive = true;
      gameStartedClean = false;
      timeRemaining = GAME_DURATION;
      redScore = 0;
      blueScore = 0;
      redScoreEl.textContent = '0';
      blueScoreEl.textContent = '0';
      updateTimerDisplay();

      debugEl.textContent = 'GAME STARTED';
      console.log('[Leaderboard] Game started - local timer running');

      // Start countdown
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          endGameByTimer();
        }
      }, 1000);
    }

    // Stop the timer
    function stopTimer() {
      if (timerInterval) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      gameActive = false;
      debugEl.textContent = 'TIMER STOPPED';
      console.log('[Leaderboard] Timer stopped');
    }

    // Reset everything for new game
    function resetGame() {
      stopTimer();
      redScore = 0;
      blueScore = 0;
      timeRemaining = GAME_DURATION;
      gameStartedClean = false;

      redScoreEl.textContent = '0';
      blueScoreEl.textContent = '0';
      updateTimerDisplay();

      debugEl.textContent = 'GAME RESET';
      console.log('[Leaderboard] Game reset');
    }

    // End game by timer expiry
    function endGameByTimer() {
      gameActive = false;
      console.log('[Leaderboard] Timer expired! Red:', redScore, 'Blue:', blueScore);
      debugEl.textContent = 'TIME UP';

      let taskName;
      if (redScore > blueScore) {
        taskName = 'timer_red_wins';
        console.log('[Leaderboard] Red wins by score');
      } else if (blueScore > redScore) {
        taskName = 'timer_blue_wins';
        console.log('[Leaderboard] Blue wins by score');
      } else {
        taskName = 'timer_tie_wins';
        console.log('[Leaderboard] Tie game');
      }

      sendTaskUpdate(taskName, 'SetNotActiveToActive');
    }

    // End game by score (50 kills)
    function endGameByScore(winner) {
      stopTimer();
      gameActive = false;
      debugEl.textContent = winner.toUpperCase() + ' WINS!';
      console.log('[Leaderboard] Game ended by score:', winner);

      // Note: CheckWinner in Portals handles the win notification
      // The iframe just stops tracking
    }

    function showKillIndicator(team) {
      const el = team === 'red' ? redKillEl : blueKillEl;
      el.classList.remove('show');
      void el.offsetWidth;
      el.classList.add('show');
    }

    function updateScore(team, newScore) {
      // STALE DATA FILTER: Reject high scores before game started clean
      if (!gameStartedClean && newScore >= 20) {
        console.log('[Leaderboard] REJECTED stale score:', team, newScore);
        return;
      }

      // Once we see a low score (1-10), game has started clean
      if (newScore <= 10 && newScore >= 1) {
        gameStartedClean = true;
      }

      // If we receive a score but game isn't active, start the game
      if (!gameActive && newScore >= 1 && newScore <= 10) {
        console.log('[Leaderboard] Score received, starting game');
        startLocalTimer();
      }

      const scoreEl = team === 'red' ? redScoreEl : blueScoreEl;
      const oldScore = team === 'red' ? redScore : blueScore;

      if (team === 'red') {
        redScore = newScore;
      } else {
        blueScore = newScore;
      }

      scoreEl.textContent = Math.min(WIN_SCORE, newScore);

      // Show kill indicator if score increased
      if (newScore > oldScore) {
        scoreEl.classList.remove('changed');
        void scoreEl.offsetWidth;
        scoreEl.classList.add('changed');
        showKillIndicator(team);
      }

      debugEl.textContent = 'R:' + redScore + ' B:' + blueScore;

      // Check for win by score
      if (newScore >= WIN_SCORE) {
        endGameByScore(team);
      }
    }

    function sendTaskUpdate(taskName, taskState) {
      if (typeof PortalsSdk === 'undefined') return;
      try {
        PortalsSdk.sendMessageToUnity(JSON.stringify({
          TaskName: taskName,
          TaskTargetState: taskState
        }));
        console.log('[Leaderboard] Sent task:', taskName, taskState);
      } catch (e) {
        console.error('[Leaderboard] Failed to send task:', e);
      }
    }

    function handlePortalsMessage(message) {
      let data = message;
      if (typeof message === 'string') {
        try { data = JSON.parse(message); } catch (e) { data = message; }
      }

      const msg = typeof data === 'string' ? data : JSON.stringify(data);
      console.log('[Leaderboard] Received:', msg);

      // GAME START - Begin local timer
      if (msg === 'game_start') {
        startLocalTimer();
        return;
      }

      // RESET - Stop timer and clear scores
      if (msg === 'reset') {
        resetGame();
        return;
      }

      // RED SCORE UPDATE: red_XX
      if (msg.startsWith('red_')) {
        const score = parseFloat(msg.substring(4));
        if (!isNaN(score)) {
          updateScore('red', score);
        }
        return;
      }

      // BLUE SCORE UPDATE: blue_XX
      if (msg.startsWith('blue_')) {
        const score = parseFloat(msg.substring(5));
        if (!isNaN(score)) {
          updateScore('blue', score);
        }
        return;
      }

      // SYNC MESSAGE (legacy format): sync_elapsed_red_blue
      if (msg.startsWith('sync_')) {
        const parts = msg.substring(5).split('_');
        if (parts.length >= 3) {
          // parts[0] = elapsed (ignored - using local timer)
          const red = parseFloat(parts[1]);
          const blue = parseFloat(parts[2]);
          if (!isNaN(red)) updateScore('red', red);
          if (!isNaN(blue)) updateScore('blue', blue);
        }
        return;
      }

      // LEGACY TIME MESSAGES (ignored - using local timer)
      if (msg.startsWith('time_')) {
        console.log('[Leaderboard] Ignoring server time - using local timer');
        // If we receive time messages, it means game is running
        // Start our local timer if not already running
        if (!gameActive && !timerInterval) {
          const elapsed = parseFloat(msg.substring(5));
          if (!isNaN(elapsed) && elapsed < GAME_DURATION - 10) {
            // Game recently started, start our timer
            startLocalTimer();
          }
        }
        return;
      }
    }

    // Initialize
    function init() {
      console.log('[Leaderboard] Initializing - Local Timer Version v3.0');

      // Set up message listener
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
        PortalsSdk.setMessageListener(handlePortalsMessage);
      } else {
        window.addEventListener('message', (e) => handlePortalsMessage(e.data));
      }

      // Initial display
      updateTimerDisplay();

      // NOTE: Removed leaderboard_ready notification - not needed and causes spam if task doesn't exist

      debugEl.textContent = 'WAITING';
      console.log('[Leaderboard] Ready - waiting for game_start');
    }

    // Start when DOM is ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
