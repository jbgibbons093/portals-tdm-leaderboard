<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TDM Leaderboard</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005456"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .leaderboard-bar {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      width: 100%;
      height: 96px;
      background: transparent;
    }

    .score-container {
      display: flex;
      align-items: center;
      height: 100%;
      background: linear-gradient(180deg, rgba(0,0,0,0.9) 0%, rgba(20,20,30,0.95) 100%);
      border-bottom: 3px solid rgba(255,255,255,0.1);
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border-radius: 0 0 12px 12px;
    }

    .team-score {
      display: flex;
      align-items: center;
      padding: 0 36px;
      height: 100%;
      min-width: 210px;
    }

    .red-team {
      background: linear-gradient(135deg, rgba(220,38,38,0.3) 0%, rgba(185,28,28,0.2) 100%);
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .red-team .team-label {
      color: #ef4444;
      text-shadow: 0 0 10px rgba(239,68,68,0.5);
    }

    .red-team .score {
      color: #fca5a5;
      text-shadow: 0 0 15px rgba(239,68,68,0.7);
    }

    .blue-team {
      background: linear-gradient(135deg, rgba(37,99,235,0.3) 0%, rgba(29,78,216,0.2) 100%);
      border-left: 1px solid rgba(255,255,255,0.1);
    }

    .blue-team .team-label {
      color: #3b82f6;
      text-shadow: 0 0 10px rgba(59,130,246,0.5);
    }

    .blue-team .score {
      color: #93c5fd;
      text-shadow: 0 0 15px rgba(59,130,246,0.7);
    }

    .team-label {
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin-right: 18px;
    }

    .score {
      font-size: 42px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
    }

    .timer-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0 30px;
      min-width: 150px;
      background: rgba(255,255,255,0.05);
      height: 100%;
      border-left: 1px solid rgba(255,255,255,0.1);
      border-right: 1px solid rgba(255,255,255,0.1);
    }

    .timer-label {
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .timer {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .timer.warning {
      color: #fbbf24;
      text-shadow: 0 0 15px rgba(251,191,36,0.7);
      animation: pulse 1s ease-in-out infinite;
    }

    .timer.critical {
      color: #ef4444;
      text-shadow: 0 0 15px rgba(239,68,68,0.7);
      animation: pulse 0.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .vs-divider {
      font-size: 14px;
      font-weight: 800;
      color: rgba(255,255,255,0.3);
      padding: 0 8px;
    }

    /* Score change animation */
    .score.changed {
      animation: scoreFlash 0.3s ease-out;
    }

    @keyframes scoreFlash {
      0% { transform: scale(1.3); }
      100% { transform: scale(1); }
    }

  </style>
</head>
<body>
  <div class="leaderboard-bar">
    <div class="score-container">
      <div class="team-score red-team">
        <span class="team-label">RED</span>
        <span class="score" id="redScore">0</span>
      </div>

      <div class="timer-section">
        <span class="timer-label">Time</span>
        <span class="timer" id="timer">10:00</span>
      </div>

      <div class="team-score blue-team">
        <span class="score" id="blueScore">0</span>
        <span class="team-label" style="margin-right: 0; margin-left: 12px;">BLUE</span>
      </div>
    </div>
  </div>

  <!-- DEBUG: Remove after testing -->
  <div id="debug" style="position:fixed;bottom:10px;left:10px;background:rgba(0,0,0,0.8);color:lime;padding:5px 10px;font-size:12px;font-family:monospace;z-index:999;">Waiting for messages...</div>

  <script>
    // ===========================================
    // TDM Leaderboard for Portals
    // Server-side timer approach - Portals controls the clock
    // ===========================================

    const GAME_DURATION = 600; // 10 minutes in seconds

    let redScore = 0;
    let blueScore = 0;
    let timeRemaining = GAME_DURATION;
    let gameActive = true;

    // DOM elements
    const redScoreEl = document.getElementById('redScore');
    const blueScoreEl = document.getElementById('blueScore');
    const timerEl = document.getElementById('timer');

    // ===========================================
    // Timer Functions
    // ===========================================

    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    function updateTimerDisplay() {
      const formatted = formatTime(timeRemaining);
      console.log('[Timer] updateTimerDisplay called - timeRemaining:', timeRemaining, '- formatted:', formatted, '- timerEl:', timerEl);

      if (!timerEl) {
        console.error('[Timer] timerEl is null!');
        return;
      }

      timerEl.textContent = formatted;

      // Warning states
      timerEl.classList.remove('warning', 'critical');
      if (timeRemaining <= 60) {
        timerEl.classList.add('critical');
      } else if (timeRemaining <= 120) {
        timerEl.classList.add('warning');
      }
    }

    // Update time from server-provided elapsed seconds
    function setElapsedTime(elapsed) {
      timeRemaining = Math.max(0, GAME_DURATION - elapsed);
      updateTimerDisplay();

      // Only allow game end after initialized (3 second delay) to prevent race conditions
      if (timeRemaining <= 0 && gameActive && initialized) {
        endGameByTimer();
      }
    }

    function endGameByTimer() {
      gameActive = false;

      // Determine winner and send task to Portals
      // Portals will show the game-over.html iframe
      let winner;
      if (redScore > blueScore) {
        winner = 'red';
      } else if (blueScore > redScore) {
        winner = 'blue';
      } else {
        winner = 'tie';
      }

      // Send winner task to Portals
      sendTaskUpdate(`timer_${winner}_wins`, 'SetNotActiveToActive');
      console.log('[Leaderboard] Timer ended - winner:', winner, 'Score:', redScore, '-', blueScore);
    }

    // ===========================================
    // Score Functions
    // ===========================================

    function updateScore(team, newScore) {
      if (!gameActive) return;

      const scoreEl = team === 'red' ? redScoreEl : blueScoreEl;
      const oldScore = team === 'red' ? redScore : blueScore;

      if (team === 'red') {
        redScore = newScore;
      } else {
        blueScore = newScore;
      }

      scoreEl.textContent = newScore;

      // Animate score change
      if (newScore !== oldScore) {
        scoreEl.classList.remove('changed');
        void scoreEl.offsetWidth; // Trigger reflow
        scoreEl.classList.add('changed');
      }

      // Check for score-based win (first to 50)
      if (newScore >= 50) {
        endGameByScore(team);
      }
    }

    function endGameByScore(winner) {
      gameActive = false;

      // Send task to Portals - it will show game-over.html iframe
      // Note: score-based wins use the existing RedWins/BlueWins tasks
      // which are triggered by CheckWinner in Portals, not from here
      console.log('[Leaderboard] Score win - winner:', winner, 'Score:', redScore, '-', blueScore);
    }

    // ===========================================
    // Portals SDK Integration
    // ===========================================

    function sendTaskUpdate(taskName, taskState) {
      if (typeof PortalsSdk === 'undefined') {
        console.log('[Leaderboard] SDK not available, would send:', taskName, taskState);
        return;
      }

      try {
        PortalsSdk.sendMessageToUnity(JSON.stringify({
          TaskName: taskName,
          TaskTargetState: taskState
        }));
        console.log('[Leaderboard] Sent task:', taskName, '->', taskState);
      } catch (e) {
        console.error('[Leaderboard] Failed to send task:', e);
      }
    }

    function handlePortalsMessage(message) {
      console.log('[Leaderboard] Received:', message);

      // DEBUG: Show on screen
      const debugEl = document.getElementById('debug');
      if (debugEl) {
        debugEl.textContent = 'Received: ' + JSON.stringify(message).substring(0, 50);
      }

      let data = message;

      // Parse if string - but DON'T return on failure, it might be underscore format
      if (typeof message === 'string') {
        try {
          data = JSON.parse(message);
        } catch (e) {
          // Not JSON - keep as string for underscore format parsing below
          console.log('[Leaderboard] Plain string message:', message);
          data = message;
        }
      }

      // Handle simple format messages (no JSON - colons break Portals parser)
      // Format: "prefix_value" or "prefix_value1_value2_value3"
      const msg = typeof data === 'string' ? data : JSON.stringify(data);

      if (msg.startsWith('time_')) {
        // time_123 -> elapsed seconds
        const elapsed = parseFloat(msg.substring(5));
        document.getElementById('debug').textContent = 'Parsed: ' + elapsed + ' | Remaining: ' + (600 - elapsed);
        if (!isNaN(elapsed)) {
          setElapsedTime(elapsed);
          console.log('[Leaderboard] Time update - elapsed:', elapsed, '- remaining:', timeRemaining);
        }
      } else if (msg.startsWith('red_')) {
        // red_5 -> red score
        const score = parseFloat(msg.substring(4));
        if (!isNaN(score)) {
          updateScore('red', score);
        }
      } else if (msg.startsWith('blue_')) {
        // blue_3 -> blue score
        const score = parseFloat(msg.substring(5));
        if (!isNaN(score)) {
          updateScore('blue', score);
        }
      } else if (msg.startsWith('sync_')) {
        // sync_elapsed_red_blue -> full sync
        const parts = msg.substring(5).split('_');
        if (parts.length >= 3) {
          const elapsed = parseFloat(parts[0]);
          const red = parseFloat(parts[1]);
          const blue = parseFloat(parts[2]);
          if (!isNaN(elapsed)) setElapsedTime(elapsed);
          if (!isNaN(red)) {
            redScore = red;
            redScoreEl.textContent = red;
          }
          if (!isNaN(blue)) {
            blueScore = blue;
            blueScoreEl.textContent = blue;
          }
          updateTimerDisplay();
          console.log('[Leaderboard] Sync - elapsed:', elapsed, 'red:', red, 'blue:', blue);
        }
      } else if (msg === 'reset') {
        resetGame();
      } else {
        // Try parsing as just a number (elapsed seconds)
        const num = parseFloat(msg);
        if (!isNaN(num)) {
          setElapsedTime(num);
          console.log('[Leaderboard] Raw number - elapsed:', num);
        }
      }
    }

    function resetGame() {
      gameActive = true;
      redScore = 0;
      blueScore = 0;
      timeRemaining = GAME_DURATION;

      redScoreEl.textContent = '0';
      blueScoreEl.textContent = '0';
      updateTimerDisplay();
      gameOverEl.classList.remove('show');

      // Notify Portals that game reset is ready
      sendTaskUpdate('leaderboard_reset', 'SetNotActiveToCompleted');
    }

    // ===========================================
    // Initialize
    // ===========================================

    // Set up Portals message listener
    if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
      PortalsSdk.setMessageListener(handlePortalsMessage);
      console.log('[Leaderboard] SDK listener registered');
    } else {
      // Fallback for testing
      window.addEventListener('message', (e) => handlePortalsMessage(e.data));
      console.log('[Leaderboard] Using fallback listener');
    }

    // Initial display
    updateTimerDisplay();

    // Notify Portals that leaderboard is ready
    // Portals will respond with either 'startAsHost' (first player) or 'syncState' (late joiner)
    sendTaskUpdate('leaderboard_ready', 'SetNotActiveToCompleted');

    console.log('[Leaderboard] Initialized - waiting for Portals to assign host/sync');
  </script>
</body>
</html>
