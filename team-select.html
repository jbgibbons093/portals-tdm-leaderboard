<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Select</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005503"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Rajdhani', sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, rgba(0,15,25,0.92) 0%, rgba(0,5,15,0.98) 100%);
    }

    /* Grid pattern overlay */
    .overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background:
        linear-gradient(rgba(0,212,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,212,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
      pointer-events: none;
      z-index: 1;
    }

    /* Animated scan line */
    .overlay::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(0,212,255,0.3) 40%,
        rgba(0,212,255,0.6) 50%,
        rgba(0,212,255,0.3) 60%,
        transparent 100%
      );
      animation: scanVertical 4s linear infinite;
      pointer-events: none;
      z-index: 100;
    }

    @keyframes scanVertical {
      0% { top: -4px; }
      100% { top: 100%; }
    }

    .team-select-container {
      position: relative;
      background: linear-gradient(180deg, rgba(0,20,35,0.98) 0%, rgba(0,10,25,0.99) 100%);
      padding: 35px 45px;
      min-width: 750px;
      max-width: 950px;
      z-index: 10;
      clip-path: polygon(
        30px 0, calc(100% - 30px) 0,
        100% 30px, 100% calc(100% - 15px),
        calc(100% - 15px) 100%, 15px 100%,
        0 calc(100% - 15px), 0 30px
      );
    }

    /* Outer glow frame */
    .team-select-container::before {
      content: '';
      position: absolute;
      top: -2px;
      left: -2px;
      right: -2px;
      bottom: -2px;
      background: linear-gradient(135deg,
        rgba(0,212,255,0.7) 0%,
        rgba(0,212,255,0.15) 25%,
        rgba(0,212,255,0.15) 75%,
        rgba(0,212,255,0.7) 100%
      );
      clip-path: polygon(
        30px 0, calc(100% - 30px) 0,
        100% 30px, 100% calc(100% - 15px),
        calc(100% - 15px) 100%, 15px 100%,
        0 calc(100% - 15px), 0 30px
      );
      z-index: -1;
      animation: framePulse 3s ease-in-out infinite;
    }

    @keyframes framePulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Inner scan effect */
    .team-select-container::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg,
        rgba(0,212,255,0.08) 0%,
        transparent 20%,
        transparent 80%,
        rgba(0,212,255,0.08) 100%
      );
      pointer-events: none;
    }

    /* Corner decorations */
    .corner-bracket {
      position: absolute;
      width: 20px;
      height: 20px;
      border-color: rgba(0,212,255,0.6);
      border-style: solid;
      pointer-events: none;
    }

    .corner-bracket.tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
    .corner-bracket.tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
    .corner-bracket.bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
    .corner-bracket.br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(0,212,255,0.2);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 3px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.8), transparent);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 28px;
      font-weight: 900;
      color: #00d4ff;
      text-transform: uppercase;
      letter-spacing: 12px;
      text-shadow: 0 0 30px rgba(0,212,255,0.5);
    }

    .subtitle {
      font-family: 'Share Tech Mono', monospace;
      font-size: 13px;
      color: rgba(0,212,255,0.6);
      text-transform: uppercase;
      letter-spacing: 6px;
      margin-top: 10px;
    }

    .teams-wrapper {
      display: flex;
      gap: 25px;
      margin-bottom: 25px;
    }

    .team-column {
      flex: 1;
      background: rgba(0,0,0,0.4);
      padding: 20px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      position: relative;
      clip-path: polygon(
        15px 0, calc(100% - 15px) 0,
        100% 15px, 100% 100%,
        0 100%, 0 15px
      );
    }

    .team-column::before {
      content: '';
      position: absolute;
      top: -1px;
      left: -1px;
      right: -1px;
      bottom: -1px;
      clip-path: polygon(
        15px 0, calc(100% - 15px) 0,
        100% 15px, 100% 100%,
        0 100%, 0 15px
      );
      z-index: -1;
    }

    .team-column.red::before {
      background: linear-gradient(180deg, rgba(255,68,68,0.5) 0%, rgba(255,68,68,0.15) 100%);
    }

    .team-column.blue::before {
      background: linear-gradient(180deg, rgba(68,136,255,0.5) 0%, rgba(68,136,255,0.15) 100%);
    }

    .team-column.red {
      background: linear-gradient(180deg, rgba(255,50,50,0.15) 0%, rgba(100,20,20,0.2) 100%);
    }

    .team-column.blue {
      background: linear-gradient(180deg, rgba(50,100,255,0.15) 0%, rgba(20,50,100,0.2) 100%);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .team-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 18px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .team-name.red {
      color: #ff4444;
      text-shadow: 0 0 15px rgba(255,68,68,0.6);
    }
    .team-name.blue {
      color: #4488ff;
      text-shadow: 0 0 15px rgba(68,136,255,0.6);
    }

    .team-count {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 2px;
    }

    .player-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      margin-bottom: 6px;
      clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
      border-left: 2px solid rgba(255,255,255,0.1);
    }

    .player-item.is-me {
      background: rgba(0,212,255,0.15);
      border-left: 2px solid rgba(0,212,255,0.6);
    }

    .player-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 1px;
    }

    .player-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      padding: 4px 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      clip-path: polygon(5px 0, 100% 0, calc(100% - 5px) 100%, 0 100%);
    }

    .player-status.ready {
      background: rgba(74,222,128,0.25);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.4);
    }

    .player-status.not-ready {
      background: rgba(255,170,0,0.2);
      color: #ffaa00;
      border: 1px solid rgba(255,170,0,0.3);
    }

    .join-btn {
      width: 100%;
      padding: 14px;
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%);
    }

    .join-btn.red {
      background: linear-gradient(180deg, rgba(255,68,68,0.4) 0%, rgba(180,30,30,0.5) 100%);
      color: #ff6b6b;
      border: 1px solid rgba(255,68,68,0.5);
    }

    .join-btn.red:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(255,68,68,0.6) 0%, rgba(200,40,40,0.7) 100%);
      box-shadow: 0 0 25px rgba(255,68,68,0.5), inset 0 0 20px rgba(255,68,68,0.2);
    }

    .join-btn.blue {
      background: linear-gradient(180deg, rgba(68,136,255,0.4) 0%, rgba(30,80,180,0.5) 100%);
      color: #6bb3ff;
      border: 1px solid rgba(68,136,255,0.5);
    }

    .join-btn.blue:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(68,136,255,0.6) 0%, rgba(40,100,200,0.7) 100%);
      box-shadow: 0 0 25px rgba(68,136,255,0.5), inset 0 0 20px rgba(68,136,255,0.2);
    }

    .join-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .join-btn.joined {
      background: rgba(0,212,255,0.15);
      color: rgba(0,212,255,0.7);
      border-color: rgba(0,212,255,0.3);
    }

    .actions {
      display: flex;
      gap: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(0,212,255,0.15);
    }

    .ready-btn {
      flex: 1;
      padding: 18px 35px;
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      clip-path: polygon(15px 0, 100% 0, calc(100% - 15px) 100%, 0 100%);
      position: relative;
    }

    .ready-btn.not-ready {
      background: linear-gradient(180deg, rgba(74,222,128,0.35) 0%, rgba(34,180,80,0.45) 100%);
      color: #4ade80;
      border: 2px solid rgba(74,222,128,0.5);
    }

    .ready-btn.not-ready:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(74,222,128,0.5) 0%, rgba(34,200,90,0.6) 100%);
      box-shadow: 0 0 30px rgba(74,222,128,0.5), inset 0 0 25px rgba(74,222,128,0.2);
    }

    .ready-btn.is-ready {
      background: linear-gradient(180deg, rgba(255,68,68,0.35) 0%, rgba(180,30,30,0.45) 100%);
      color: #ff6b6b;
      border: 2px solid rgba(255,68,68,0.5);
      animation: readyPulse 2s ease-in-out infinite;
    }

    @keyframes readyPulse {
      0%, 100% { box-shadow: 0 0 20px rgba(74,222,128,0.3); }
      50% { box-shadow: 0 0 35px rgba(74,222,128,0.6); }
    }

    .ready-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-bar {
      text-align: center;
      margin-top: 20px;
    }

    .status-text {
      font-family: 'Share Tech Mono', monospace;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .status-text.all-ready {
      color: #4ade80;
      text-shadow: 0 0 15px rgba(74,222,128,0.6);
      animation: statusPulse 1.5s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }

    .countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,10,20,0.95);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 50;
      clip-path: polygon(
        30px 0, calc(100% - 30px) 0,
        100% 30px, 100% calc(100% - 15px),
        calc(100% - 15px) 100%, 15px 100%,
        0 calc(100% - 15px), 0 30px
      );
    }

    .countdown-overlay.show {
      display: flex;
    }

    .countdown-label {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: rgba(0,212,255,0.7);
      text-transform: uppercase;
      letter-spacing: 8px;
      margin-bottom: 10px;
    }

    .countdown-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 140px;
      font-weight: 900;
      color: #00d4ff;
      text-shadow:
        0 0 40px rgba(0,212,255,0.8),
        0 0 80px rgba(0,212,255,0.4);
      animation: countPulse 1s ease-in-out infinite;
    }

    @keyframes countPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .empty-team {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.25);
      font-family: 'Share Tech Mono', monospace;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .loading-state {
      text-align: center;
      padding: 50px;
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0,212,255,0.15);
      border-top-color: rgba(0,212,255,0.8);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: rgba(0,212,255,0.6);
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,20,30,0.9);
      color: #00d4ff;
      padding: 6px 12px;
      font-size: 11px;
      font-family: 'Share Tech Mono', monospace;
      z-index: 999;
      max-width: 500px;
      border: 1px solid rgba(0,212,255,0.3);
      clip-path: polygon(5px 0, 100% 0, 100% calc(100% - 5px), calc(100% - 5px) 100%, 0 100%, 0 5px);
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="team-select-container">
      <div class="corner-bracket tl"></div>
      <div class="corner-bracket tr"></div>
      <div class="corner-bracket bl"></div>
      <div class="corner-bracket br"></div>

      <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-label">Deploying In</div>
        <div class="countdown-number" id="countdownNumber">3</div>
      </div>

      <div class="header">
        <div class="title">Select Team</div>
        <div class="subtitle" id="subtitleText">// Choose Your Side</div>
      </div>

      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <div class="loading-text">Connecting...</div>
      </div>

      <div id="mainContent" style="display: none;">
        <div class="teams-wrapper">
          <div class="team-column red">
            <div class="team-header">
              <span class="team-name red">Red Team</span>
              <span class="team-count" id="redCount">0/4</span>
            </div>
            <div class="player-list" id="redPlayerList">
              <div class="empty-team">// Awaiting Spartans</div>
            </div>
            <button class="join-btn red" id="joinRedBtn">Join Red</button>
          </div>

          <div class="team-column blue">
            <div class="team-header">
              <span class="team-name blue">Blue Team</span>
              <span class="team-count" id="blueCount">0/4</span>
            </div>
            <div class="player-list" id="bluePlayerList">
              <div class="empty-team">// Awaiting Spartans</div>
            </div>
            <button class="join-btn blue" id="joinBlueBtn">Join Blue</button>
          </div>
        </div>

        <div class="actions">
          <button class="ready-btn not-ready" id="readyBtn" disabled>Select a Team</button>
        </div>

        <div class="status-bar">
          <div class="status-text" id="statusText">// Waiting for players</div>
        </div>
      </div>
    </div>
  </div>

  <div id="debug">SPARTAN LOBBY v3.0</div>

  <script>
    // ===========================================
    // Team Selection for Portals TDM - v36 EVENT-DRIVEN
    // ===========================================
    // Updates are PUSHED via broadcast_lobby task
    // No polling - Portals broadcasts on every change
    // ===========================================

    const MAX_SLOTS = 8;
    const MAX_PER_TEAM = 4;

    let mySlot = 0;
    let myTeam = 0;
    let myReady = false;
    let gameStarting = false;
    let allReadySent = false;
    let gameInProgress = false;

    const slots = {};
    for (let i = 1; i <= MAX_SLOTS; i++) {
      slots[i] = { claimed: 0, team: 0, ready: 0 };
    }

    const loadingState = document.getElementById('loadingState');
    const mainContent = document.getElementById('mainContent');
    const redPlayerList = document.getElementById('redPlayerList');
    const bluePlayerList = document.getElementById('bluePlayerList');
    const redCount = document.getElementById('redCount');
    const blueCount = document.getElementById('blueCount');
    const joinRedBtn = document.getElementById('joinRedBtn');
    const joinBlueBtn = document.getElementById('joinBlueBtn');
    const readyBtn = document.getElementById('readyBtn');
    const statusText = document.getElementById('statusText');
    const subtitleText = document.getElementById('subtitleText');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const debugEl = document.getElementById('debug');

    function debug(msg) {
      console.log('[TS v36]', msg);
      debugEl.textContent = 'v36 | slot:' + mySlot + ' team:' + myTeam + ' | ' + msg;
    }

    function sendTask(taskName, state) {
      if (typeof PortalsSdk === 'undefined' || !PortalsSdk.sendMessageToUnity) {
        console.log('[TS] No SDK, would send:', taskName);
        return;
      }
      PortalsSdk.sendMessageToUnity(JSON.stringify({
        TaskName: taskName,
        TaskTargetState: state || 'SetNotActiveToActive'
      }));
      debug('Sent: ' + taskName);
    }

    function resetState() {
      mySlot = 0;
      myTeam = 0;
      myReady = false;
      gameStarting = false;
      allReadySent = false;
      for (let i = 1; i <= MAX_SLOTS; i++) {
        slots[i] = { claimed: 0, team: 0, ready: 0 };
      }
      countdownOverlay.classList.remove('show');
      loadingState.innerHTML = `
        <div class="loading-spinner"></div>
        <div class="loading-text">Connecting...</div>
      `;
      loadingState.style.display = 'block';
      mainContent.style.display = 'none';
    }

    function parseSync(msgStr) {
      if (!msgStr.startsWith('lobbysync_')) return false;
      const parts = msgStr.substring(10).split('_');
      for (let i = 0; i < MAX_SLOTS; i++) {
        const idx = i * 3;
        if (idx + 2 < parts.length) {
          slots[i + 1] = {
            claimed: parseInt(parts[idx]) || 0,
            team: parseInt(parts[idx + 1]) || 0,
            ready: parseInt(parts[idx + 2]) || 0
          };
        }
      }
      if (mySlot > 0 && slots[mySlot]) {
        myTeam = slots[mySlot].team;
        myReady = slots[mySlot].ready === 1;
      }
      return true;
    }

    function getPlayersOnTeam(teamNum) {
      return Object.entries(slots)
        .filter(([_, d]) => d.claimed === 1 && d.team === teamNum)
        .map(([s, d]) => ({ slot: parseInt(s), ...d }));
    }

    function render() {
      if (mySlot === 0) return;

      const redPlayers = getPlayersOnTeam(1);
      const bluePlayers = getPlayersOnTeam(2);

      redPlayerList.innerHTML = redPlayers.length === 0
        ? '<div class="empty-team">// Awaiting Spartans</div>'
        : redPlayers.map(p => `
            <div class="player-item ${p.slot === mySlot ? 'is-me' : ''}">
              <span class="player-name">SPARTAN-${p.slot.toString().padStart(2, '0')}${p.slot === mySlot ? ' (You)' : ''}</span>
              <span class="player-status ${p.ready ? 'ready' : 'not-ready'}">${p.ready ? 'Ready' : 'Standby'}</span>
            </div>
          `).join('');
      redCount.textContent = redPlayers.length + '/' + MAX_PER_TEAM;

      bluePlayerList.innerHTML = bluePlayers.length === 0
        ? '<div class="empty-team">// Awaiting Spartans</div>'
        : bluePlayers.map(p => `
            <div class="player-item ${p.slot === mySlot ? 'is-me' : ''}">
              <span class="player-name">SPARTAN-${p.slot.toString().padStart(2, '0')}${p.slot === mySlot ? ' (You)' : ''}</span>
              <span class="player-status ${p.ready ? 'ready' : 'not-ready'}">${p.ready ? 'Ready' : 'Standby'}</span>
            </div>
          `).join('');
      blueCount.textContent = bluePlayers.length + '/' + MAX_PER_TEAM;

      joinRedBtn.disabled = myReady || myTeam === 1 || redPlayers.length >= MAX_PER_TEAM;
      joinRedBtn.textContent = myTeam === 1 ? 'Deployed' : (redPlayers.length >= MAX_PER_TEAM ? 'Full' : 'Join Red');
      joinRedBtn.classList.toggle('joined', myTeam === 1);

      joinBlueBtn.disabled = myReady || myTeam === 2 || bluePlayers.length >= MAX_PER_TEAM;
      joinBlueBtn.textContent = myTeam === 2 ? 'Deployed' : (bluePlayers.length >= MAX_PER_TEAM ? 'Full' : 'Join Blue');
      joinBlueBtn.classList.toggle('joined', myTeam === 2);

      if (myTeam === 0) {
        readyBtn.disabled = true;
        readyBtn.textContent = 'Select a Team';
        readyBtn.className = 'ready-btn not-ready';
      } else if (gameStarting) {
        readyBtn.disabled = true;
        readyBtn.textContent = 'Deploying...';
        readyBtn.className = 'ready-btn not-ready';
      } else {
        readyBtn.disabled = false;
        readyBtn.textContent = myReady ? 'Cancel Ready' : 'Ready Up';
        readyBtn.className = myReady ? 'ready-btn is-ready' : 'ready-btn not-ready';
      }

      const allWithTeam = Object.values(slots).filter(s => s.claimed && s.team > 0);
      const allReady = allWithTeam.filter(s => s.ready);

      if (allWithTeam.length === 0) {
        statusText.textContent = '// Waiting for players';
        statusText.className = 'status-text';
      } else if (redPlayers.length === 0 || bluePlayers.length === 0) {
        statusText.textContent = '// Need players on both teams';
        statusText.className = 'status-text';
      } else if (allReady.length === allWithTeam.length && allWithTeam.length >= 2) {
        statusText.textContent = '// All Spartans Ready';
        statusText.className = 'status-text all-ready';
        if (!allReadySent) {
          allReadySent = true;
          sendTask('all_players_ready');
        }
      } else {
        statusText.textContent = '// ' + allReady.length + '/' + allWithTeam.length + ' players ready';
        statusText.className = 'status-text';
      }

      debug('Rendered: red=' + redPlayers.length + ' blue=' + bluePlayers.length);
    }

    joinRedBtn.addEventListener('click', () => {
      if (myReady || myTeam === 1 || mySlot === 0) return;
      myTeam = 1;
      slots[mySlot].team = 1;
      sendTask('join_red');
      render();
    });

    joinBlueBtn.addEventListener('click', () => {
      if (myReady || myTeam === 2 || mySlot === 0) return;
      myTeam = 2;
      slots[mySlot].team = 2;
      sendTask('join_blue');
      render();
    });

    readyBtn.addEventListener('click', () => {
      if (myTeam === 0 || gameStarting || mySlot === 0) return;
      if (myReady) {
        myReady = false;
        slots[mySlot].ready = 0;
        sendTask('player_unready');
      } else {
        myReady = true;
        slots[mySlot].ready = 1;
        sendTask('player_ready');
      }
      render();
    });

    function startCountdown(seconds) {
      if (gameStarting) return;
      gameStarting = true;
      countdownOverlay.classList.add('show');

      let count = seconds || 3;
      countdownNumber.textContent = count;

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownNumber.textContent = count;
        } else {
          clearInterval(interval);
          countdownNumber.textContent = 'GO!';
          setTimeout(() => {
            resetState();
            debug('Game started - reset');
          }, 2000);
        }
      }, 1000);

      render();
    }

    function handleMessage(message) {
      let msgStr = message;
      if (typeof message !== 'string') {
        try { msgStr = JSON.stringify(message); } catch(e) { msgStr = String(message); }
      }

      console.log('[TS v36] Received:', msgStr);

      if (msgStr.startsWith('game_status_')) {
        const status = parseInt(msgStr.substring(12)) || 0;
        debug('Game status: ' + status);
        if (status === 1) {
          loadingState.innerHTML = `
            <div class="loading-text" style="font-size:16px;color:#ffaa00;letter-spacing:6px;">MATCH IN PROGRESS</div>
            <div class="loading-text" style="margin-top:15px;font-size:11px;opacity:0.5;">// Standby for deployment</div>
          `;
          loadingState.style.display = 'block';
          mainContent.style.display = 'none';
        }
        return;
      }

      if (msgStr.startsWith('my_slot_')) {
        const newSlot = parseInt(msgStr.substring(8)) || 0;
        debug('Got slot: ' + newSlot);

        if (gameInProgress) {
          debug('Ignoring slot - game in progress');
          return;
        }

        if (newSlot > 0) {
          resetState();
          mySlot = newSlot;
          slots[mySlot].claimed = 1;
          loadingState.style.display = 'none';
          mainContent.style.display = 'block';
          subtitleText.textContent = '// SPARTAN-' + newSlot.toString().padStart(2, '0') + ' Assigned';
          render();
          debug('UI shown for slot ' + mySlot);
        }
        return;
      }

      if (msgStr.startsWith('lobbysync_')) {
        debug('Got sync');
        if (parseSync(msgStr)) {
          render();
        }
        return;
      }

      if (msgStr.startsWith('countdown_')) {
        const secs = parseInt(msgStr.substring(10)) || 3;
        startCountdown(secs);
        return;
      }
      if (msgStr === 'start') {
        startCountdown(3);
        return;
      }

      if (msgStr === 'reset') {
        gameInProgress = false;
        resetState();
        debug('Reset received');
        return;
      }

      if (msgStr === 'exit_lobby') {
        resetState();
        debug('Exited lobby');
        return;
      }

      if (msgStr === 'reset_teamselect' || msgStr === 'enter_lobby') {
        debug('Ignored: ' + msgStr + ' (waiting for my_slot_X)');
        return;
      }

      if (msgStr.startsWith('sync_')) {
        gameInProgress = true;
        debug('Game active - sync received');
        loadingState.innerHTML = `
          <div class="loading-text" style="font-size:16px;color:#ffaa00;letter-spacing:6px;">MATCH IN PROGRESS</div>
          <div class="loading-text" style="margin-top:15px;font-size:11px;opacity:0.5;">// Standby for deployment</div>
        `;
        loadingState.style.display = 'block';
        mainContent.style.display = 'none';
        return;
      }

      if (msgStr.startsWith('time_')) return;

      debug('Unknown: ' + msgStr.substring(0, 30));
    }

    // Function to notify Portals that team select is ready
    function sendTeamSelectReady() {
      if (typeof PortalsSdk !== 'undefined' && PortalsSdk.sendMessageToUnity) {
        PortalsSdk.sendMessageToUnity(JSON.stringify({
          TaskName: 'team_select_ready',
          TaskTargetState: 'SetNotActiveToCompleted'
        }));
        debug('Sent team_select_ready');
      }
    }

    if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
      PortalsSdk.setMessageListener(handleMessage);
      debug('SDK ready');

      // Notify Portals we're ready after a short delay to ensure connection
      setTimeout(() => {
        sendTeamSelectReady();
      }, 300);
    } else {
      window.addEventListener('message', (e) => handleMessage(e.data));
      debug('Fallback listener');
    }

    console.log('[TS v36] Initialized - waiting for my_slot_X from Portals');
  </script>
</body>
</html>
