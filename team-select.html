<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Select</title>

  <!-- Portals SDK -->
  <script src="https://portals-labs.github.io/portals-sdk/portals-sdk.js?v=10005502"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      font-family: 'Rajdhani', 'Segoe UI', sans-serif;
      background: transparent;
      overflow: hidden;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(ellipse at center, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0.95) 100%);
    }

    .overlay::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: repeating-linear-gradient(0deg, rgba(0,0,0,0.1) 0px, rgba(0,0,0,0.1) 1px, transparent 1px, transparent 3px);
      pointer-events: none;
      z-index: 10;
    }

    .team-select-container {
      position: relative;
      background: linear-gradient(180deg, rgba(10,10,20,0.95) 0%, rgba(20,20,35,0.98) 100%);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 12px;
      padding: 30px 40px;
      min-width: 700px;
      max-width: 900px;
      box-shadow: 0 0 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,255,255,0.1);
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .title {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 8px;
      text-shadow: 0 0 20px rgba(255,255,255,0.3);
    }

    .subtitle {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.4);
      text-transform: uppercase;
      letter-spacing: 4px;
      margin-top: 8px;
    }

    .teams-wrapper {
      display: flex;
      gap: 30px;
      margin-bottom: 30px;
    }

    .team-column {
      flex: 1;
      background: rgba(0,0,0,0.3);
      border-radius: 10px;
      padding: 20px;
      min-height: 280px;
      display: flex;
      flex-direction: column;
    }

    .team-column.red {
      border: 2px solid rgba(239,68,68,0.4);
      box-shadow: inset 0 0 30px rgba(239,68,68,0.1);
    }

    .team-column.blue {
      border: 2px solid rgba(59,130,246,0.4);
      box-shadow: inset 0 0 30px rgba(59,130,246,0.1);
    }

    .team-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }

    .team-name {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 4px;
    }

    .team-name.red { color: #ef4444; text-shadow: 0 0 15px rgba(239,68,68,0.5); }
    .team-name.blue { color: #3b82f6; text-shadow: 0 0 15px rgba(59,130,246,0.5); }

    .team-count {
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      color: rgba(255,255,255,0.5);
    }

    .player-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 15px;
    }

    .player-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255,255,255,0.03);
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .player-item.is-me {
      background: rgba(168,85,247,0.2);
      border: 1px solid rgba(168,85,247,0.4);
    }

    .player-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 600;
      color: #ffffff;
    }

    .player-status {
      font-family: 'Orbitron', sans-serif;
      font-size: 10px;
      padding: 3px 8px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .player-status.ready {
      background: rgba(74,222,128,0.2);
      color: #4ade80;
      border: 1px solid rgba(74,222,128,0.4);
    }

    .player-status.not-ready {
      background: rgba(251,191,36,0.2);
      color: #fbbf24;
      border: 1px solid rgba(251,191,36,0.4);
    }

    .join-btn {
      width: 100%;
      padding: 12px;
      font-family: 'Orbitron', sans-serif;
      font-size: 14px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .join-btn.red {
      background: linear-gradient(180deg, rgba(239,68,68,0.3) 0%, rgba(185,28,28,0.4) 100%);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.5);
    }

    .join-btn.red:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(239,68,68,0.5) 0%, rgba(185,28,28,0.6) 100%);
      box-shadow: 0 0 20px rgba(239,68,68,0.4);
    }

    .join-btn.blue {
      background: linear-gradient(180deg, rgba(59,130,246,0.3) 0%, rgba(29,78,216,0.4) 100%);
      color: #93c5fd;
      border: 1px solid rgba(59,130,246,0.5);
    }

    .join-btn.blue:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(59,130,246,0.5) 0%, rgba(29,78,216,0.6) 100%);
      box-shadow: 0 0 20px rgba(59,130,246,0.4);
    }

    .join-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .join-btn.joined {
      background: rgba(255,255,255,0.1);
      color: rgba(255,255,255,0.5);
      border-color: rgba(255,255,255,0.2);
    }

    .actions {
      display: flex;
      gap: 20px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.1);
    }

    .ready-btn {
      flex: 1;
      padding: 16px 30px;
      font-family: 'Orbitron', sans-serif;
      font-size: 16px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .ready-btn.not-ready {
      background: linear-gradient(180deg, rgba(74,222,128,0.3) 0%, rgba(34,197,94,0.4) 100%);
      color: #4ade80;
      border: 2px solid rgba(74,222,128,0.5);
    }

    .ready-btn.not-ready:hover:not(:disabled) {
      background: linear-gradient(180deg, rgba(74,222,128,0.5) 0%, rgba(34,197,94,0.6) 100%);
      box-shadow: 0 0 25px rgba(74,222,128,0.4);
    }

    .ready-btn.is-ready {
      background: linear-gradient(180deg, rgba(239,68,68,0.3) 0%, rgba(185,28,28,0.4) 100%);
      color: #fca5a5;
      border: 2px solid rgba(239,68,68,0.5);
    }

    .ready-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .status-bar {
      text-align: center;
      margin-top: 20px;
    }

    .status-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    .status-text.all-ready {
      color: #4ade80;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }

    .countdown-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.8);
      display: none;
      justify-content: center;
      align-items: center;
      border-radius: 12px;
      z-index: 20;
    }

    .countdown-overlay.show {
      display: flex;
    }

    .countdown-number {
      font-family: 'Orbitron', sans-serif;
      font-size: 120px;
      font-weight: 900;
      color: #ffffff;
      text-shadow: 0 0 60px rgba(255,255,255,0.5);
    }

    .empty-team {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255,255,255,0.3);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .loading-state {
      text-align: center;
      padding: 40px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.1);
      border-top-color: rgba(255,255,255,0.7);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-text {
      font-family: 'Orbitron', sans-serif;
      font-size: 12px;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 3px;
    }

    #debug {
      position: fixed;
      bottom: 10px;
      left: 10px;
      background: rgba(0,0,0,0.9);
      color: lime;
      padding: 8px 12px;
      font-size: 11px;
      font-family: monospace;
      z-index: 999;
      max-width: 500px;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="overlay">
    <div class="team-select-container">
      <div class="countdown-overlay" id="countdownOverlay">
        <div class="countdown-number" id="countdownNumber">3</div>
      </div>

      <div class="header">
        <div class="title">Select Team</div>
        <div class="subtitle" id="subtitleText">Choose your side</div>
      </div>

      <div class="loading-state" id="loadingState">
        <div class="loading-spinner"></div>
        <div class="loading-text">Joining lobby...</div>
      </div>

      <div id="mainContent" style="display: none;">
        <div class="teams-wrapper">
          <div class="team-column red">
            <div class="team-header">
              <span class="team-name red">Red Team</span>
              <span class="team-count" id="redCount">0/4</span>
            </div>
            <div class="player-list" id="redPlayerList">
              <div class="empty-team">No players</div>
            </div>
            <button class="join-btn red" id="joinRedBtn">Join Red</button>
          </div>

          <div class="team-column blue">
            <div class="team-header">
              <span class="team-name blue">Blue Team</span>
              <span class="team-count" id="blueCount">0/4</span>
            </div>
            <div class="player-list" id="bluePlayerList">
              <div class="empty-team">No players</div>
            </div>
            <button class="join-btn blue" id="joinBlueBtn">Join Blue</button>
          </div>
        </div>

        <div class="actions">
          <button class="ready-btn not-ready" id="readyBtn" disabled>Select a Team</button>
        </div>

        <div class="status-bar">
          <div class="status-text" id="statusText">Waiting for players...</div>
        </div>
      </div>
    </div>
  </div>

  <div id="debug">v34 Loading...</div>

  <script>
    // ===========================================
    // Team Selection for Portals TDM - v34
    // SIMPLIFIED: Only responds to my_slot_X and lobbysync_
    // Blocks matchmaking if game is in progress (sync_ detected)
    // ===========================================

    const MAX_SLOTS = 8;
    const MAX_PER_TEAM = 4;

    // Core state
    let mySlot = 0;      // 1-8, or 0 if not assigned
    let myTeam = 0;      // 0=none, 1=red, 2=blue
    let myReady = false;
    let gameStarting = false;
    let allReadySent = false;
    let gameInProgress = false;  // True if we detect an active game

    // Slot data: { 1: {claimed, team, ready}, ... }
    const slots = {};
    for (let i = 1; i <= MAX_SLOTS; i++) {
      slots[i] = { claimed: 0, team: 0, ready: 0 };
    }

    // DOM
    const loadingState = document.getElementById('loadingState');
    const mainContent = document.getElementById('mainContent');
    const redPlayerList = document.getElementById('redPlayerList');
    const bluePlayerList = document.getElementById('bluePlayerList');
    const redCount = document.getElementById('redCount');
    const blueCount = document.getElementById('blueCount');
    const joinRedBtn = document.getElementById('joinRedBtn');
    const joinBlueBtn = document.getElementById('joinBlueBtn');
    const readyBtn = document.getElementById('readyBtn');
    const statusText = document.getElementById('statusText');
    const subtitleText = document.getElementById('subtitleText');
    const countdownOverlay = document.getElementById('countdownOverlay');
    const countdownNumber = document.getElementById('countdownNumber');
    const debugEl = document.getElementById('debug');

    // ===========================================
    // Debug
    // ===========================================
    function debug(msg) {
      console.log('[TS v33]', msg);
      debugEl.textContent = 'v33 | slot:' + mySlot + ' team:' + myTeam + ' | ' + msg;
    }

    // ===========================================
    // Send task to Portals
    // ===========================================
    function sendTask(taskName, state) {
      if (typeof PortalsSdk === 'undefined' || !PortalsSdk.sendMessageToUnity) {
        console.log('[TS] No SDK, would send:', taskName);
        return;
      }
      PortalsSdk.sendMessageToUnity(JSON.stringify({
        TaskName: taskName,
        TaskTargetState: state || 'SetNotActiveToActive'
      }));
      debug('Sent: ' + taskName);
    }

    // ===========================================
    // Reset all state
    // ===========================================
    function resetState() {
      mySlot = 0;
      myTeam = 0;
      myReady = false;
      gameStarting = false;
      allReadySent = false;
      for (let i = 1; i <= MAX_SLOTS; i++) {
        slots[i] = { claimed: 0, team: 0, ready: 0 };
      }
      countdownOverlay.classList.remove('show');
      loadingState.style.display = 'block';
      mainContent.style.display = 'none';
    }

    // ===========================================
    // Parse lobbysync message
    // ===========================================
    function parseSync(msgStr) {
      // Format: lobbysync_C1_T1_R1_C2_T2_R2_...
      if (!msgStr.startsWith('lobbysync_')) return false;

      const parts = msgStr.substring(10).split('_');

      for (let i = 0; i < MAX_SLOTS; i++) {
        const idx = i * 3;
        if (idx + 2 < parts.length) {
          slots[i + 1] = {
            claimed: parseInt(parts[idx]) || 0,
            team: parseInt(parts[idx + 1]) || 0,
            ready: parseInt(parts[idx + 2]) || 0
          };
        }
      }

      // Update my state from my slot
      if (mySlot > 0 && slots[mySlot]) {
        myTeam = slots[mySlot].team;
        myReady = slots[mySlot].ready === 1;
      }

      return true;
    }

    // ===========================================
    // Rendering
    // ===========================================
    function getPlayersOnTeam(teamNum) {
      return Object.entries(slots)
        .filter(([_, d]) => d.claimed === 1 && d.team === teamNum)
        .map(([s, d]) => ({ slot: parseInt(s), ...d }));
    }

    function render() {
      if (mySlot === 0) return;

      const redPlayers = getPlayersOnTeam(1);
      const bluePlayers = getPlayersOnTeam(2);

      // Red team list
      redPlayerList.innerHTML = redPlayers.length === 0
        ? '<div class="empty-team">No players</div>'
        : redPlayers.map(p => `
            <div class="player-item ${p.slot === mySlot ? 'is-me' : ''}">
              <span class="player-name">Player ${p.slot}${p.slot === mySlot ? ' (You)' : ''}</span>
              <span class="player-status ${p.ready ? 'ready' : 'not-ready'}">${p.ready ? 'Ready' : 'Waiting'}</span>
            </div>
          `).join('');
      redCount.textContent = redPlayers.length + '/' + MAX_PER_TEAM;

      // Blue team list
      bluePlayerList.innerHTML = bluePlayers.length === 0
        ? '<div class="empty-team">No players</div>'
        : bluePlayers.map(p => `
            <div class="player-item ${p.slot === mySlot ? 'is-me' : ''}">
              <span class="player-name">Player ${p.slot}${p.slot === mySlot ? ' (You)' : ''}</span>
              <span class="player-status ${p.ready ? 'ready' : 'not-ready'}">${p.ready ? 'Ready' : 'Waiting'}</span>
            </div>
          `).join('');
      blueCount.textContent = bluePlayers.length + '/' + MAX_PER_TEAM;

      // Join buttons
      joinRedBtn.disabled = myReady || myTeam === 1 || redPlayers.length >= MAX_PER_TEAM;
      joinRedBtn.textContent = myTeam === 1 ? 'Joined' : (redPlayers.length >= MAX_PER_TEAM ? 'Full' : 'Join Red');
      joinRedBtn.classList.toggle('joined', myTeam === 1);

      joinBlueBtn.disabled = myReady || myTeam === 2 || bluePlayers.length >= MAX_PER_TEAM;
      joinBlueBtn.textContent = myTeam === 2 ? 'Joined' : (bluePlayers.length >= MAX_PER_TEAM ? 'Full' : 'Join Blue');
      joinBlueBtn.classList.toggle('joined', myTeam === 2);

      // Ready button
      if (myTeam === 0) {
        readyBtn.disabled = true;
        readyBtn.textContent = 'Select a Team';
        readyBtn.className = 'ready-btn not-ready';
      } else if (gameStarting) {
        readyBtn.disabled = true;
        readyBtn.textContent = 'Starting...';
        readyBtn.className = 'ready-btn not-ready';
      } else {
        readyBtn.disabled = false;
        readyBtn.textContent = myReady ? 'Cancel Ready' : 'Ready Up';
        readyBtn.className = myReady ? 'ready-btn is-ready' : 'ready-btn not-ready';
      }

      // Status
      const allWithTeam = Object.values(slots).filter(s => s.claimed && s.team > 0);
      const allReady = allWithTeam.filter(s => s.ready);

      if (allWithTeam.length === 0) {
        statusText.textContent = 'Waiting for players...';
        statusText.className = 'status-text';
      } else if (redPlayers.length === 0 || bluePlayers.length === 0) {
        statusText.textContent = 'Need players on both teams';
        statusText.className = 'status-text';
      } else if (allReady.length === allWithTeam.length && allWithTeam.length >= 2) {
        statusText.textContent = 'All players ready!';
        statusText.className = 'status-text all-ready';
        if (!allReadySent) {
          allReadySent = true;
          sendTask('all_players_ready');
        }
      } else {
        statusText.textContent = allReady.length + '/' + allWithTeam.length + ' players ready';
        statusText.className = 'status-text';
      }

      debug('Rendered: red=' + redPlayers.length + ' blue=' + bluePlayers.length);
    }

    // ===========================================
    // Button handlers
    // ===========================================
    joinRedBtn.addEventListener('click', () => {
      if (myReady || myTeam === 1 || mySlot === 0) return;
      myTeam = 1;
      slots[mySlot].team = 1;
      sendTask('join_red');
      render();
    });

    joinBlueBtn.addEventListener('click', () => {
      if (myReady || myTeam === 2 || mySlot === 0) return;
      myTeam = 2;
      slots[mySlot].team = 2;
      sendTask('join_blue');
      render();
    });

    readyBtn.addEventListener('click', () => {
      if (myTeam === 0 || gameStarting || mySlot === 0) return;
      if (myReady) {
        myReady = false;
        slots[mySlot].ready = 0;
        sendTask('player_unready');
      } else {
        myReady = true;
        slots[mySlot].ready = 1;
        sendTask('player_ready');
      }
      render();
    });

    // ===========================================
    // Countdown
    // ===========================================
    function startCountdown(seconds) {
      if (gameStarting) return;
      gameStarting = true;
      countdownOverlay.classList.add('show');

      let count = seconds || 3;
      countdownNumber.textContent = count;

      const interval = setInterval(() => {
        count--;
        if (count > 0) {
          countdownNumber.textContent = count;
        } else {
          clearInterval(interval);
          countdownNumber.textContent = 'GO!';
          setTimeout(() => {
            resetState();
            debug('Game started - reset');
          }, 2000);
        }
      }, 1000);

      render();
    }

    // ===========================================
    // Message handler - SIMPLIFIED
    // ===========================================
    function handleMessage(message) {
      let msgStr = message;
      if (typeof message !== 'string') {
        try { msgStr = JSON.stringify(message); } catch(e) { msgStr = String(message); }
      }

      console.log('[TS v33] Received:', msgStr);

      // ===== GAME STATUS =====
      // If game is in progress, show waiting message
      if (msgStr.startsWith('game_status_')) {
        const status = parseInt(msgStr.substring(12)) || 0;
        debug('Game status: ' + status);
        if (status === 1) {
          loadingState.innerHTML = `
            <div class="loading-text" style="font-size:18px;color:#fbbf24;">GAME IN PROGRESS</div>
            <div class="loading-text" style="margin-top:15px;font-size:11px;opacity:0.5;">Please wait for current match to end</div>
          `;
          loadingState.style.display = 'block';
          mainContent.style.display = 'none';
        }
        return;
      }

      // ===== MY SLOT ASSIGNMENT =====
      // This is the PRIMARY trigger - when we get a slot, show the UI
      if (msgStr.startsWith('my_slot_')) {
        const newSlot = parseInt(msgStr.substring(8)) || 0;
        debug('Got slot: ' + newSlot);

        // Don't show UI if a game is already in progress
        if (gameInProgress) {
          debug('Ignoring slot - game in progress');
          return;
        }

        if (newSlot > 0) {
          // Reset state for fresh start (handles re-entry)
          resetState();

          // Set our slot
          mySlot = newSlot;
          slots[mySlot].claimed = 1;

          // Show UI
          loadingState.style.display = 'none';
          mainContent.style.display = 'block';
          subtitleText.textContent = 'You are Player ' + mySlot;

          render();
          debug('UI shown for slot ' + mySlot);
        }
        return;
      }

      // ===== LOBBY SYNC =====
      // Updates the player list
      if (msgStr.startsWith('lobbysync_')) {
        debug('Got sync');
        if (parseSync(msgStr)) {
          render();
        }
        return;
      }

      // ===== COUNTDOWN =====
      if (msgStr.startsWith('countdown_')) {
        const secs = parseInt(msgStr.substring(10)) || 3;
        startCountdown(secs);
        return;
      }
      if (msgStr === 'start') {
        startCountdown(3);
        return;
      }

      // ===== RESET =====
      if (msgStr === 'reset') {
        gameInProgress = false;
        resetState();
        debug('Reset received');
        return;
      }

      // ===== EXIT LOBBY =====
      // Player left the trigger zone
      if (msgStr === 'exit_lobby') {
        resetState();
        debug('Exited lobby');
        return;
      }

      // ===== LEGACY MESSAGES (ignored) =====
      // These are handled by Portals directly now
      if (msgStr === 'reset_teamselect' || msgStr === 'enter_lobby') {
        debug('Ignored: ' + msgStr + ' (waiting for my_slot_X)');
        return;
      }

      // ===== SYNC MESSAGE (from active game) =====
      // If we receive sync_, a game is in progress
      if (msgStr.startsWith('sync_')) {
        gameInProgress = true;
        debug('Game active - sync received');
        loadingState.innerHTML = `
          <div class="loading-text" style="font-size:18px;color:#fbbf24;">GAME IN PROGRESS</div>
          <div class="loading-text" style="margin-top:15px;font-size:11px;opacity:0.5;">Please wait for current match to end</div>
        `;
        loadingState.style.display = 'block';
        mainContent.style.display = 'none';
        return;
      }

      // Ignore time updates and other messages
      if (msgStr.startsWith('time_')) return;

      debug('Unknown: ' + msgStr.substring(0, 30));
    }

    // ===========================================
    // Initialize
    // ===========================================
    if (typeof PortalsSdk !== 'undefined' && PortalsSdk.setMessageListener) {
      PortalsSdk.setMessageListener(handleMessage);
      debug('SDK ready');
    } else {
      window.addEventListener('message', (e) => handleMessage(e.data));
      debug('Fallback listener');
    }

    console.log('[TS v33] Initialized - waiting for my_slot_X from Portals');
  </script>
</body>
</html>
